name: Test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: 'JBang Latest, Java ${{ matrix.java }}, ${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        java: [ 11, 17, 21, 24 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Run action
        uses: ./
        with:
          version: latest

      - shell: bash
        run: |
          jbang version
