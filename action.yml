name: Setup JBang

description: 'Set up a specific version of JBang and add it to the PATH'

branding:
  icon: 'terminal'
  color: 'blue'

inputs:
  version:
    description: 'The version of JBang to download'
    default: 'latest'
    required: true

  setup-java:
    default: 'true'
    description: 'Setup internal Java runtime.'
    required: false

  cache:
    default: 'true'
    description: 'Cache JBang files'
    type: boolean
    required: false

runs:
  using: 'composite'
  steps:
    - name: Generate JBang cache key
      id: get-yearmonth
      shell: bash
      if: ${{ inputs.cache == 'true' }}
      run: |
        # idea: monthly cache refresh
        echo "yearmonth=jbang-$(date +%Y-%m)" >> $GITHUB_OUTPUT
    - name: Cache JBang
      id: cache-jbang
      if: ${{ inputs.cache == 'true' }}
      uses: actions/cache@v4
      with:
        path: ~/.jbang
        key: ${{ runner.os }}-${{ steps.get-yearmonth.outputs.yearmonth }}
    - name: 'Download JBang'
      shell: bash
      if: (runner.os != 'Windows') && ((inputs.cache != 'true') || (steps.cache-jbang.outputs.cache-hit != 'true'))
      env:
        VERSION_INPUT: ${{ inputs.version }}
      run: |
        echo "::group::⬇️ Download JBang"
        if [[ "$VERSION_INPUT" != "latest" ]]; then
          export JBANG_DOWNLOAD_VERSION=$VERSION_INPUT
        fi
        curl -Ls https://sh.jbang.dev | bash -s - app setup
        echo "${HOME}/.jbang/bin" >> $GITHUB_PATH
        ${HOME}/.jbang/bin/jbang version
        echo "::endgroup::"
    - name: 'Setup JBang'
      shell: bash
      if: runner.os != 'Windows'
      run: |
        echo "::group::🔧 Setup JBang"
        echo "${HOME}/.jbang/bin" >> $GITHUB_PATH
        ${HOME}/.jbang/bin/jbang version
        echo "::endgroup::"
    - name: 'Download JBang (Windows)'
      shell: pwsh
      if: (runner.os == 'Windows') && ((inputs.cache != 'true') || (steps.cache-jbang.outputs.cache-hit != 'true'))
      env:
        VERSION_INPUT: ${{ inputs.version }}
      run: |
        echo "::group::⬇️ Download JBang"
        if ($env:VERSION_INPUT -ne "latest") {
          $env:JBANG_DOWNLOAD_VERSION = $env:VERSION_INPUT
        }
        iex "& { $(iwr https://ps.jbang.dev) } app setup"
        echo "::endgroup::"
    - name: 'Setup JBang (Windows)'
      shell: pwsh
      if: runner.os == 'Windows'
      run: |
        echo "::group::🔧 Setup JBang"
        echo "$HOME\.jbang\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        & $HOME\.jbang\bin\jbang.ps1 version
        echo "::endgroup::"
